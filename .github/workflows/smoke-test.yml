# Prueba automática: en cada cambio abre la web en un navegador (móvil y escritorio,
# claro y oscuro, 4 idiomas) y avisa por email si algo se rompe.
name: Prueba de la web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Probar la web
        run: node tests/smoke.mjs
